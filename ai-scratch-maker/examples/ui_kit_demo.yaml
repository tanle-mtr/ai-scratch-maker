  - name: 标题文字
    x: 0
    y: 112
    costumes:
    - name: title
      asset: assets/uikit/text_开始游戏_30_d.png
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
  - name: 主按钮
    x: 0
    y: 20
    costumes:
    - name: primary_normal_l
      asset: assets/uikit/btn_primary_normal_l.svg
    - name: primary_hover_l
      asset: assets/uikit/btn_primary_hover_l.svg
    - name: primary_pressed_l
      asset: assets/uikit/btn_primary_pressed_l.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
      - looks_switchcostumeto:
          COSTUME: primary_normal_l
    - - when_receive:
          message: 帧
      - if:
          cond:
            and:
            - equals:
              - var: 弹窗
              - 0
            - and:
              - touching:
                  object: _mouse_
              - sensing_mousedown: null
          do:
          - looks_switchcostumeto:
              COSTUME: primary_pressed_l
      - if:
          cond:
            and:
            - equals:
              - var: 弹窗
              - 0
            - and:
              - touching:
                  object: _mouse_
              - not:
                  operand:
                    equals:
                    - sensing_mousedown: null
                    - true
          do:
          - looks_switchcostumeto:
              COSTUME: primary_hover_l
      - if:
          cond:
            or:
            - equals:
              - var: 弹窗
              - 1
            - not:
                operand:
                  equals:
                  - touching:
                      object: _mouse_
                  - true
          do:
          - looks_switchcostumeto:
              COSTUME: primary_normal_l
    - - when_this_sprite_clicked: null
      - if:
          cond:
            equals:
            - var: 弹窗
            - 0
          do:
          - sound_play:
              SOUND_MENU: ui_click
          - broadcast:
              message: 重开
    sounds:
    - name: ui_click
      asset: assets/audio/ui_click.wav
  - name: 主按钮文字
    x: 0
    y: 20
    costumes:
    - name: t
