project:
  name: UI Kit 演示（矢量素材 + 四状态按钮 + 弹窗 + 进度条）
  stage:
    backdrops:
    - name: 菜单背景
      asset: assets/uikit/bg_menu.svg
    variables:
      弹窗: 0
      血量: 100
      档: 100
      自动帧: 1
      帧计数: 0
    lists: {}
    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 自动帧
          value: 1
      - set_variable:
          var: 弹窗
          value: 0
      - set_variable:
          var: 血量
          value: 100
      - set_variable:
          var: 档
          value: 100
      - set_variable:
          var: 帧计数
          value: 0
      - show: null
      - forever:
          do:
          - if:
              cond:
                equals:
                - var: 自动帧
                - 1
              do:
              - change_variable:
                  var: 帧计数
                  by: 1
              - broadcast:
                  message: 帧
          - wait:
              secs: 0.02
    - - when_receive:
          message: 开设置
      - set_variable:
          var: 弹窗
          value: 1
      - sound_play:
          SOUND_MENU: ev_open
    - - when_receive:
          message: 关设置
      - set_variable:
          var: 弹窗
          value: 0
      - sound_play:
          SOUND_MENU: ev_close
    - - when_receive:
          message: 重开
      - set_variable:
          var: 血量
          value: 100
    sounds:
    - name: ev_open
      asset: assets/audio/ev_open.wav
    - name: ev_close
      asset: assets/audio/ev_close.wav
  sprites:
  - name: 血条
    x: -168
    y: 158
    costumes:
    - name: bar_hp_100
      asset: assets/uikit/bar_hp_100.svg
    - name: bar_hp_010
      asset: assets/uikit/bar_hp_010.svg
    - name: bar_hp_020
      asset: assets/uikit/bar_hp_020.svg
    - name: bar_hp_030
      asset: assets/uikit/bar_hp_030.svg
    - name: bar_hp_040
      asset: assets/uikit/bar_hp_040.svg
    - name: bar_hp_050
      asset: assets/uikit/bar_hp_050.svg
    - name: bar_hp_060
      asset: assets/uikit/bar_hp_060.svg
    - name: bar_hp_070
      asset: assets/uikit/bar_hp_070.svg
    - name: bar_hp_080
      asset: assets/uikit/bar_hp_080.svg
    - name: bar_hp_090
      asset: assets/uikit/bar_hp_090.svg
    - name: bar_hp_000
      asset: assets/uikit/bar_hp_000.svg
    size: 70
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
      - looks_switchcostumeto:
          COSTUME: bar_hp_100
    - - when_receive:
          message: 帧
      - if:
          cond:
            equals:
            - var: 弹窗
            - 0
          do:
          - change_variable:
              var: 血量
              by: -0.5
      - if:
          cond:
            less_than:
            - var: 血量
            - 5
          do:
          - set_variable:
              var: 血量
              value: 100
      - set_variable:
          var: 档
          value:
            multiply:
            - round:
              - divide:
                - var: 血量
                - 10
            - 10
      - if:
          cond:
            not:
              operand:
                equals:
                - less_than:
                  - var: 档
                  - 100
                - true
          do:
          - looks_switchcostumeto:
              COSTUME: bar_hp_100
          else:
          - looks_switchcostumeto:
              COSTUME:
                join:
                  a: bar_hp_0
                  b:
                    var: 档
    - - when_receive:
          message: 重开
      - set_variable:
          var: 血量
          value: 100
  - name: 星级
    x: -168
    y: 126
    size: 70
    costumes:
    - name: stars
      asset: assets/uikit/badge_stars.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
  - name: 缎带
