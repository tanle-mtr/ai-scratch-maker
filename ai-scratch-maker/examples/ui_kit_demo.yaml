              - 1
            - not:
                operand:
                  equals:
                  - touching:
                      object: _mouse_
                  - true
          do:
          - looks_switchcostumeto:
              COSTUME: secondary_normal_m
    - - when_this_sprite_clicked: null
      - if:
          cond:
            equals:
            - var: 弹窗
            - 0
          do:
          - sound_play:
              SOUND_MENU: ui_click
          - broadcast:
              message: 开设置
    sounds:
    - name: ui_click
      asset: assets/audio/ui_click.wav
  - name: 设置按钮文字
