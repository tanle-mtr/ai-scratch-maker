  sprites:
  - name: 裁判
    x: 0
    y: 0
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_receive:
          message: 设模式
      - if:

          cond:

            equals:

            - var: 音效开

            - 1

          do:

          - play_sound:

              sound: 点击音

      - if:
          cond:
            equals:
            - var: 模式
            - 1
          do:
          - set_variable:
              var: 漏刀系数
              value: 0.8
          - set_variable:
              var: 波间隔
              value: 30
          - set_variable:
              var: 塔减伤
              value: 0.6
          - set_variable:
              var: 镀层
              value: 0
          - set_variable:
              var: 一血塔已发
              value: 0
      - if:
          cond:
            equals:
            - var: 模式
            - 2
          do:
          - set_variable:
              var: 漏刀系数
              value: 0.4
          - set_variable:
              var: 波间隔
              value: 30
          - set_variable:
              var: 塔减伤
              value: 1
          - set_variable:
              var: 镀层
              value: 5
          - set_variable:
              var: 一血塔已发
              value: 0
      - if:
          cond:
            equals:
            - var: 模式
            - 3
          do:
          - set_variable:
              var: 当前阶段
              value: 0
          - set_variable:
              var: 回合角色
              value: 1
          - set_variable:
              var: 牌堆数
              value: 10
          - set_variable:
              var: 弃牌堆数
              value: 0
          - set_variable:
              var: 判定区数
              value: 0
          - set_variable:
              var: 胜负
              value: 继续
      - if:
          cond:
            equals:
            - var: 模式
            - 4
          do:
          - set_variable:
              var: 金币铲
              value: 0
          - set_variable:
              var: 人口
              value: 1
          - set_variable:
              var: 生命
              value: 100
          - set_variable:
              var: 连胜
              value: 0
          - set_variable:
              var: 连败
              value: 0
          - set_variable:
              var: 淘汰
              value: 0
      - set_variable:
          var: 结果
          value:
            join:
              a:
                join:
                  a: '模式 '
                  b:
                    var: 模式
              b: ' 已装载'
    - - when_receive:
          message: 兵线推进
      - set_variable:
          var: 波次
          value:
            add:
            - 1
            - round:
              - divide:
                - var: 游戏秒
                - var: 波间隔
      - set_variable:
          var: 临时
          value:
            multiply:
            - var: 兵线速度
            - var: 波间隔
      - if:
          cond:
            equals:
            - var: 遇敌
            - 1
          do:
          - set_variable:
              var: 结果
              value: 双方兵线接触：停下交战，进度不变
          else:
          - set_variable:
              var: 兵线进度
              value:
                add:
                - var: 兵线进度
                - var: 临时
          - if:
              cond:
                greater_than:
                - var: 兵线进度
                - 1
              do:
              - set_variable:
                  var: 兵线进度
                  value: 1
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    join:
                      a:
                        join:
                          a: 波次
                          b:
                            var: 波次
                      b: ' 进度'
                  b:
                    var: 兵线进度
      - if:
          cond:
            equals:
            - var: 超级兵
            - 1
          do:
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    var: 结果
                  b: ' / 本波含超级兵'
      - set_variable:
          var: 临时2
          value: 0
      - if:
          cond:
            and:
            - equals:
              - var: 模式
              - 2
            - equals:
              - mod:
                - var: 波次
                - 3
              - 0
          do:
          - set_variable:
              var: 临时2
              value: 1
      - if:
          cond:
            and:
            - equals:
              - var: 模式
              - 1
            - not:
                operand:
                  equals:
                  - less_than:
                    - var: 波次
                    - 7
                  - true
          do:
          - set_variable:
              var: 临时2
              value: 1
      - if:
          cond:
            equals:
            - var: 临时2
            - 1
          do:
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    var: 结果
                  b: ' / 含炮车'
    - - when_receive:
          message: 塔索敌
      - set_variable:
          var: 最优优先级
          value: 99
      - set_variable:
          var: 最优单位
          value: 0
      - set_variable:
          var: 最优距离
          value: 99999
      - set_variable:
          var: i
          value: 0
      - repeat:
          times:
            var: 候选数
          do:
          - change_variable:
              var: i
              by: 1
          - set_variable:
              var: 目标类型
              value:
                item_of_list:
                  list: 候选类型
                  index:
                    var: i
          - set_variable:
              var: 当前距离
              value:
                item_of_list:
                  list: 候选距离
                  index:
                    var: i
          - set_variable:
              var: 候选伤害标记
              value:
                item_of_list:
                  list: 候选伤害英雄
                  index:
                    var: i
          - if:
              cond:
                equals:
                - var: 模式
                - 2
              do:
              - if:
                  cond:
                    equals:
                    - var: 候选伤害标记
                    - 1
                  do:
                  - set_variable:
                      var: 当前优先级
                      value: 1
                  else:
                  - if:
                      cond:
                        equals:
                        - var: 目标类型
                        - 6
                      do:
                      - set_variable:
                          var: 当前优先级
                          value: 2
                      else:
                      - if:
                          cond:
                            equals:
                            - var: 目标类型
                            - 7
                          do:
                          - set_variable:
                              var: 当前优先级
                              value: 3
                          else:
                          - if:
                              cond:
                                or:
                                - equals:
                                  - var: 目标类型
                                  - 4
                                - equals:
                                  - var: 目标类型
                                  - 5
                              do:
                              - set_variable:
                                  var: 当前优先级
                                  value: 4
                              else:
                              - if:
                                  cond:
                                    equals:
                                    - var: 目标类型
                                    - 2
                                  do:
                                  - set_variable:
                                      var: 当前优先级
                                      value: 5
                                  else:
                                  - if:
                                      cond:
                                        equals:
                                        - var: 目标类型
                                        - 3
                                      do:
                                      - set_variable:
                                          var: 当前优先级
                                          value: 6
                                      else:
                                      - set_variable:
                                          var: 当前优先级
                                          value: 7
              else:
              - if:
                  cond:
                    equals:
                    - var: 候选伤害标记
                    - 1
                  do:
                  - set_variable:
                      var: 当前优先级
                      value: 1
                  else:
                  - if:
                      cond:
                        not:
                          operand:
                            equals:
                            - less_than:
                              - var: 目标类型
                              - 2
                            - true
                      do:
                      - set_variable:
                          var: 当前优先级
                          value: 2
                      else:
                      - set_variable:
                          var: 当前优先级
                          value: 3
          - if:
              cond:
                or:
                - less_than:
                  - var: 当前优先级
                  - var: 最优优先级
                - and:
                  - equals:
                    - var: 当前优先级
                    - var: 最优优先级
                  - less_than:
                    - var: 当前距离
                    - var: 最优距离
              do:
              - set_variable:
                  var: 最优优先级
                  value:
                    var: 当前优先级
              - set_variable:
                  var: 最优单位
                  value:
                    var: i
              - set_variable:
                  var: 最优距离
                  value:
                    var: 当前距离
      - if:
          cond:
            and:
            - equals:
              - var: 模式
              - 2
            - and:
              - equals:
                - var: 塔锁定英雄
                - 1
              - greater_than:
                - var: 候选数
                - 0
          do:
          - set_variable:
              var: 结果
              value:
                join:
                  a: 'LOL 保持英雄锁定 / 计算出的最优单位 '
                  b:
                    var: 最优单位
      - if:
          cond:
            equals:
            - var: 塔锁定英雄
            - 0
          do:
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    join:
                      a:
                        join:
                          a:
                            join:
                              a:
                                join:
                                  a: '塔目标 '
                                  b:
                                    var: 最优单位
                              b: ' 优先级 '
                          b:
                            var: 最优优先级
                      b: ' 距离 '
                  b:
                    var: 最优距离
    - - when_receive:
          message: 塔攻击
      - change_variable:
          var: 塔攻击次数
          by: 1
      - set_variable:
          var: 塔伤害
          value: 100
      - if:
          cond:
            equals:
            - var: 目标类型
            - 2
          do:
          - set_variable:
              var: 塔伤害
              value: 45
      - if:
          cond:
            equals:
            - var: 目标类型
            - 3
          do:
          - set_variable:
              var: 塔伤害
              value: 70
      - if:
          cond:
            equals:
            - var: 目标类型
            - 4
          do:
          - set_variable:
              var: 塔伤害
              value: 14
      - if:
          cond:
            equals:
            - var: 目标类型
            - 5
          do:
          - set_variable:
              var: 塔伤害
              value: 5
      - if:
          cond:
            and:
            - equals:
              - var: 模式
              - 1
            - equals:
              - var: 目标类型
              - 1
          do:
          - set_variable:
              var: 塔伤害
              value:
                multiply:
                - 100
                - add:
                  - 1
                  - multiply:
                    - subtract:
                      - var: 塔攻击次数
                      - 1
                    - 0.3
      - if:
          cond:
            equals:
            - var: 无兵线
            - 1
          do:
          - set_variable:
              var: 临时
              value: 0.25
      - if:
          cond:
            equals:
            - var: 无兵线
            - 0
          do:
          - set_variable:
              var: 临时
              value: 1
      - set_variable:
          var: 塔伤害
          value:
            multiply:
            - var: 塔伤害
            - var: 临时
      - set_variable:
          var: 塔伤害
          value:
            multiply:
            - var: 塔伤害
            - var: 塔减伤
      - set_variable:
          var: 塔血量
          value:
            subtract:
            - var: 塔血量
            - var: 塔伤害
      - if:
          cond:
            and:
            - equals:
              - var: 模式
              - 2
            - and:
              - greater_than:
                - var: 镀层
                - 0
              - not:
                  operand:
                    equals:
                    - greater_than:
                      - var: 游戏秒
                      - 840
                    - true
          do:
          - change_variable:
              var: 镀层
              by: -1
      - if:
          cond:
            and:
            - equals:
