    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 自动帧
          value: 1
      - set_variable:
          var: 结果
          value: MOBA / 策略复刻引擎：王者 / LOL / 三国杀 / 金铲铲
      - show: null
      - if:
          cond:
            equals:
            - var: 音效开
            - 1
          do:
          - play_sound_until_done:
              sound: 背景乐
      - forever:
          do:
          - if:
              cond:
                equals:
                - var: 自动帧
                - 1
              do:
              - change_variable:
                  var: 帧计数
                  by: 1
              - broadcast:
                  message: 帧
          - wait:
              secs: 0.02
    - - when_receive:
          message: 重置
      - set_variable:
          var: 得分
          value: 0
      - set_variable:
          var: 游戏秒
          value: 0
      - set_variable:
