              - change_variable:
                  var: 同名数
                  by: 1
      - if:
          cond:
            not:
              operand:
                equals:
                - less_than:
                  - var: 同名数
                  - 3
                - true
          do:
          - set_variable:
              var: 星级
              value:
                add:
                - var: 星级
                - 1
          - set_variable:
              var: 结果
              value:
                join:
                  a: '3 合 1 → 星级 '
                  b:
                    var: 星级
          else:
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    join:
                      a: '同名数 '
                      b:
                        var: 同名数
                  b: ' < 3，不合成'
    - - when_receive:
          message: JCC羁绊
      - set_variable:
          var: 羁绊计数
          value: 0
      - set_variable:
          var: i
          value: 0
      - repeat:
          times:
            var: 棋子ID表长度
          do:
          - change_variable:
              var: i
              by: 1
          - if:
              cond:
                greater_than:
                - item_of_list:
                    list: 棋子ID表
                    index:
                      var: i
                - 0
              do:
              - change_variable:
                  var: 羁绊计数
                  by: 1
      - set_variable:
          var: 羁绊激活
          value: 0
      - if:
          cond:
            not:
              operand:
                equals:
                - less_than:
                  - var: 羁绊计数
                  - var: 羁绊阈值
                - true
          do:
          - set_variable:
              var: 羁绊激活
              value: 1
      - set_variable:
          var: 临时
          value:
            item_of_list:
              list: 羁绊阈值表
              index:
                var: 人口
      - if:
          cond:
            not:
              operand:
                equals:
                - less_than:
                  - var: 羁绊计数
                  - var: 临时
                - true
          do:
          - change_variable:
              var: 羁绊激活
              by: 1
      - set_variable:
          var: 结果
          value:
            join:
              a:
                join:
                  a:
                    join:
                      a:
                        join:
                          a:
                            join:
                              a: '不重复棋子 '
                              b:
                                var: 羁绊计数
                          b: ' 阈值 '
                      b:
                        var: 羁绊阈值
                  b: ' 激活层级 '
              b:
                var: 羁绊激活
    - - when_receive:
          message: JCC战斗
      - if:
          cond:
            greater_than:
            - var: 战力
            - var: 敌战力
          do:
          - set_variable:
              var: 本回合胜
              value: 1
          - set_variable:
              var: 扣血
              value: 0
          - set_variable:
              var: 结果
              value: 战斗胜利
          else:
          - set_variable:
              var: 本回合胜
              value: 0
          - set_variable:
              var: 扣血
              value:
                add:
                - var: 阶段基础伤害
                - var: 存活棋子
          - set_variable:
              var: 生命
              value:
                subtract:
                - var: 生命
                - var: 扣血
          - if:
              cond:
                not:
                  operand:
                    equals:
                    - greater_than:
                      - var: 生命
                      - 0
                    - true
              do:
              - set_variable:
                  var: 生命
                  value: 0
              - set_variable:
                  var: 淘汰
                  value: 1
          - set_variable:
              var: 结果
              value:
                join:
                  a:
                    join:
                      a:
                        join:
                          a: '战败 扣血 '
                          b:
                            var: 扣血
                      b: ' 生命 '
                  b:
                    var: 生命
    - - when_receive:
          message: JCC选秀
      - set_variable:
          var: 最低血者
          value: 1
      - set_variable:
          var: i
          value: 0
      - repeat:
          times: 8
          do:
          - change_variable:
              var: i
              by: 1
          - if:
              cond:
                less_than:
                - item_of_list:
                    list: 生命表
                    index:
                      var: i
                - item_of_list:
                    list: 生命表
                    index:
                      var: 最低血者
              do:
              - set_variable:
                  var: 最低血者
                  value:
                    var: i
      - set_variable:
          var: 选秀顺序
          value:
            var: 最低血者
      - set_variable:
          var: 结果
          value:
            join:
              a: '选秀首个选择者 = 生命最低的 '
              b:
                var: 最低血者
