project:
  name: 地铁模拟示例
  stage:
    backdrops:
    - name: 背景1
      asset: assets/backdrop1.svg
    variables:
      里程: 0
      速度: 0
      档位: 0
      限速: 80
      段: 1
      当前站: 1
      下一站: 2
      站总数: 3
      报站: 下一站：海涌路
      通关: 0
      车门状态: 0
      门开度: 0
      停站计时: 0
      停车偏差: 0
      到站次数: 0
      允许牵引: 1
      列车x: -200
      列车y: -40
      t: 0
      表针角: -90
      帧计数: 0
      i: 0
      加速: 0.6
      制动: 0.9
      时间倍率: 8
      表盘满量程: 100
      米每像素: 5
      自动帧: 1
      使用键盘: 1
      已画: 0
    lists:
      站名:
      - 海傍
      - 海涌路
      - 石碁南
      站里程:
      - 0
      - 800
      - 1800
      站x:
      - -200
      - 0
      - 200
      站y:
      - -40
      - -40
      - -40
      换乘:
      - 4号线
      - ''
      - 18号线
      停站帧:
      - 60
      - 60
      - 60
    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 自动帧
          value: 1
      - set_variable:
          var: 使用键盘
          value: 1
      - set_variable:
          var: 帧计数
          value: 0
      - set_variable:
          var: 站总数
          value:
            length_of_list:
              list: 站名
      - &id001
        set_variable:
          var: 里程
          value: 0
      - &id002
        set_variable:
          var: 速度
          value: 0
      - &id003
        set_variable:
          var: 档位
          value: 0
      - &id004
        set_variable:
          var: 段
          value: 1
      - &id005
        set_variable:
          var: 当前站
          value: 1
      - &id006
        set_variable:
          var: 下一站
          value: 2
      - &id007
        set_variable:
          var: 通关
          value: 0
      - &id008
        set_variable:
          var: 车门状态
          value: 0
      - &id009
        set_variable:
          var: 门开度
          value: 0
      - &id010
        set_variable:
          var: 停站计时
          value: 0
      - &id011
        set_variable:
          var: 停车偏差
          value: 0
      - &id012
        set_variable:
          var: 到站次数
          value: 0
      - &id013
        set_variable:
          var: 允许牵引
          value: 1
      - &id014
        set_variable:
          var: 列车x
          value:
            item_of_list:
              list: 站x
              index: 1
      - &id015
        set_variable:
          var: 列车y
          value:
            item_of_list:
              list: 站y
              index: 1
      - &id016
        set_variable:
          var: 表针角
          value: -90
      - &id017
        set_variable:
          var: 报站
          value:
            join:
              a: 下一站：
              b:
                item_of_list:
                  list: 站名
                  index: 2
      - &id018
        set_variable:
          var: 已画
          value: 0
      - &id019
        broadcast:
          message: 重画
      - forever:
          do:
          - if:
              cond:
                equals:
                - var: 自动帧
                - 1
              do:
              - broadcast:
                  message: 帧
          - wait:
              secs: 0.02
    - - when_receive:
          message: 重置
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
    - - when_receive:
          message: 暂停
      - set_variable:
          var: 自动帧
          value: 0
    - - when_receive:
          message: 继续
      - set_variable:
          var: 自动帧
          value: 1
  sprites:
  - name: 列车
    x: -200
    y: -40
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_receive:
          message: 帧
      - if:
          cond:
            equals:
            - var: 使用键盘
            - 1
          do:
          - if:
              cond:
                key_pressed:
                  key: up arrow
              do:
              - set_variable:
                  var: 档位
                  value: 1
              else:
              - if:
                  cond:
                    key_pressed:
                      key: down arrow
                  do:
                  - set_variable:
                      var: 档位
                      value: -1
                  else:
                  - set_variable:
                      var: 档位
                      value: 0
    - - when_receive:
          message: 帧
      - change_variable:
          var: 帧计数
          by: 1
      - if:
          cond:
            equals:
            - var: 车门状态
            - 0
          do:
          - set_variable:
              var: 允许牵引
              value: 1
          else:
          - set_variable:
              var: 允许牵引
              value: 0
      - if:
          cond:
            and:
            - equals:
              - var: 档位
              - 1
            - equals:
              - var: 允许牵引
              - 1
          do:
          - change_variable:
              var: 速度
              by:
                var: 加速
      - if:
          cond:
            equals:
            - var: 档位
            - -1
          do:
          - set_variable:
              var: 速度
              value:
                subtract:
                - var: 速度
                - var: 制动
      - if:
          cond:
            less_than:
            - var: 速度
            - 0
          do:
          - set_variable:
              var: 速度
              value: 0
      - if:
          cond:
            greater_than:
            - var: 速度
            - var: 限速
          do:
          - set_variable:
              var: 速度
              value:
                var: 限速
      - change_variable:
          var: 里程
          by:
            multiply:
            - multiply:
              - divide:
                - var: 速度
                - 3.6
              - 0.0333
            - var: 时间倍率
      - set_variable:
          var: 段
          value:
            subtract:
            - var: 下一站
            - 1
      - if:
          cond:
            less_than:
            - var: 段
            - 1
          do:
          - set_variable:
              var: 段
              value: 1
      - set_variable:
          var: t
          value:
            divide:
            - subtract:
              - var: 里程
              - item_of_list:
                  list: 站里程
                  index:
                    var: 段
            - subtract:
              - item_of_list:
                  list: 站里程
                  index:
                    var: 下一站
              - item_of_list:
                  list: 站里程
                  index:
                    var: 段
      - set_variable:
          var: 列车x
          value:
            add:
            - item_of_list:
                list: 站x
                index:
                  var: 段
            - multiply:
              - subtract:
                - item_of_list:
                    list: 站x
                    index:
                      var: 下一站
                - item_of_list:
                    list: 站x
                    index:
                      var: 段
              - var: t
      - set_variable:
          var: 列车y
          value:
            add:
            - item_of_list:
                list: 站y
                index:
                  var: 段
            - multiply:
              - subtract:
                - item_of_list:
                    list: 站y
                    index:
                      var: 下一站
                - item_of_list:
                    list: 站y
                    index:
                      var: 段
              - var: t
      - if:
          cond:
            and:
            - equals:
              - var: 通关
              - 0
            - and:
              - equals:
                - var: 车门状态
                - 0
              - and:
                - less_than:
                  - mathop:
                      operator: abs
                      num:
                        subtract:
                        - var: 里程
                        - item_of_list:
                            list: 站里程
                            index:
                              var: 下一站
                  - 15
                - less_than:
                  - var: 速度
                  - 2
          do:
          - set_variable:
              var: 停车偏差
              value:
                round:
                - subtract:
                  - var: 里程
                  - item_of_list:
                      list: 站里程
                      index:
                        var: 下一站
          - change_variable:
              var: 到站次数
              by: 1
          - set_variable:
              var: 速度
              value: 0
          - set_variable:
              var: 车门状态
              value: 1
          - broadcast:
              message: 到站
      - if:
          cond:
            equals:
            - var: 车门状态
            - 1
          do:
          - change_variable:
              var: 门开度
              by: 10
          - if:
              cond:
                not:
                  operand:
                    equals:
                    - less_than:
                      - var: 门开度
                      - 100
                    - true
              do:
              - set_variable:
                  var: 门开度
                  value: 100
              - set_variable:
                  var: 车门状态
                  value: 2
              - set_variable:
                  var: 停站计时
                  value:
                    item_of_list:
                      list: 停站帧
                      index:
                        var: 下一站
      - if:
          cond:
            equals:
            - var: 车门状态
            - 2
          do:
          - change_variable:
              var: 停站计时
              by: -1
          - if:
              cond:
                less_than:
                - var: 停站计时
                - 1
              do:
              - set_variable:
                  var: 车门状态
                  value: 3
      - if:
          cond:
            equals:
            - var: 车门状态
            - 3
          do:
          - change_variable:
              var: 门开度
              by: -10
          - if:
              cond:
                not:
                  operand:
                    equals:
                    - greater_than:
                      - var: 门开度
                      - 0
                    - true
              do:
              - set_variable:
                  var: 门开度
                  value: 0
              - set_variable:
                  var: 车门状态
                  value: 0
              - if:
                  cond:
                    greater_than:
                    - add:
                      - var: 下一站
                      - 1
                    - var: 站总数
                  do:
                  - set_variable:
                      var: 通关
                      value: 1
                  else:
                  - set_variable:
                      var: 下一站
                      value:
                        add:
                        - var: 下一站
                        - 1
                  - change_variable:
                      var: 当前站
                      by: 1
      - if:
          cond:
            equals:
            - var: 通关
            - 0
          do:
          - set_variable:
              var: 报站
              value:
                join:
                  a: 下一站：
                  b:
                    item_of_list:
                      list: 站名
                      index:
                        var: 下一站
      - set_variable:
          var: 表针角
          value:
            subtract:
            - multiply:
              - divide:
                - var: 速度
                - var: 表盘满量程
              - 180
            - 90
    - - when_receive:
          message: 帧
      - goto_xy:
          x:
            var: 列车x
          y:
            var: 列车y
    - - when_green_flag_clicked: null
      - show: null
  - name: 左门
    x: -220
    y: -40
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
    - - when_receive:
          message: 帧
      - goto_xy:
          x:
            add:
            - var: 列车x
            - add:
              - -20
              - multiply:
                - var: 门开度
                - -0.35
          y:
            var: 列车y
  - name: 右门
    x: -180
    y: -40
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
    - - when_receive:
          message: 帧
      - goto_xy:
          x:
            add:
            - var: 列车x
            - add:
              - 20
              - multiply:
                - var: 门开度
                - 0.35
          y:
            var: 列车y
  - name: 速度表针
    x: -200
    y: 110
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
      - goto_xy:
          x: -200
          y: 110
    - - when_receive:
          message: 帧
      - goto_xy:
          x: -200
          y: 110
      - point_in_direction:
          direction:
            var: 表针角
  - name: 轨道
    x: 0
    y: 0
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - hide: null
      - set_pen_size:
          size: 1
    - - when_receive:
          message: 帧
      - if:
          cond:
            equals:
            - var: 已画
            - 0
          do:
          - pen_clear: null
          - set_variable:
              var: 已画
              value: 1
          - set_pen_size:
              size: 6
          - set_pen_color:
              COLOR: '#7F7F7F'
          - pen_up: null
          - goto_xy:
              x: -235
              y: -46
          - pen_down: null
          - goto_xy:
              x: 235
              y: -46
          - pen_up: null
          - set_variable:
              var: i
              value: 0
          - repeat:
              times:
                var: 站总数
              do:
              - change_variable:
                  var: i
                  by: 1
              - set_pen_size:
                  size: 4
              - set_pen_color:
                  COLOR: '#FFCF4D'
              - pen_up: null
              - goto_xy:
                  x:
                    item_of_list:
                      list: 站x
                      index:
                        var: i
                  y: -58
              - pen_down: null
              - goto_xy:
                  x:
                    item_of_list:
                      list: 站x
                      index:
                        var: i
                  y: -34
              - pen_up: null
    - - when_receive:
          message: 重画
      - set_variable:
          var: 已画
          value: 0
