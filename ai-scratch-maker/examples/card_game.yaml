    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 自动帧
          value: 1
      - set_variable:
          var: 结果
          value: 桌游判定台：牌型/UNO/投票/警徽流/自爆/屠边/觉醒/新月事件
      - show: null
      - forever:
          do:
          - if:
              cond:
                equals:
                - var: 自动帧
                - 1
              do:
              - change_variable:
                  var: 帧计数
                  by: 1
              - broadcast:
                  message: 帧
          - wait:
              secs: 0.02
    - - when_receive:
          message: 重置
      - set_variable:
          var: 结果
          value: 已重置
  sprites:
  - name: 裁判
    x: 0
    y: 0
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_receive:
          message: 判牌型
      - set_variable:
          var: 张数
          value:
            length_of_list:
              list: 牌组
      - if:
          cond:
            equals:
            - var: 张数
            - 0
          do:
          - set_variable:
              var: 牌型
              value: 空
          - set_variable:
              var: 主值
              value: 0
          else:
          - delete_all_of_list:
              list: 计
          - repeat:
              times: 18
              do:
              - add_to_list:
                  list: 计
                  item: 0
          - set_variable:
              var: i
              value: 0
          - repeat:
              times:
                var: 张数
              do:
              - change_variable:
                  var: i
                  by: 1
              - set_variable:
                  var: v
                  value:
                    item_of_list:
                      list: 牌组
                      index:
                        var: i
              - if:
                  cond:
                    and:
                    - not:
                        operand:
                          equals:
                          - less_than:
                            - var: v
                            - 3
                          - true
                    - not:
                        operand:
                          equals:
                          - greater_than:
                            - var: v
                            - 17
                          - true
                  do:
                  - replace_item_of_list:
                      list: 计
                      index:
                        var: v
                      item:
                        add:
                        - item_of_list:
                            list: 计
                            index:
                              var: v
                        - 1
          - set_variable:
              var: 单数
              value: 0
          - set_variable:
              var: 对数
              value: 0
          - set_variable:
              var: 三数
              value: 0
          - set_variable:
              var: 四数
              value: 0
          - set_variable:
              var: 最小
              value: 0
          - set_variable:
              var: 最大
              value: 0
          - set_variable:
              var: 三值
              value: 0
          - set_variable:
              var: 四值
              value: 0
          - set_variable:
              var: 三最小
              value: 0
          - set_variable:
              var: v
              value: 0
          - repeat:
              times: 15
              do:
              - change_variable:
                  var: v
                  by: 1
              - set_variable:
                  var: c
                  value:
                    item_of_list:
                      list: 计
                      index:
                        add:
                        - var: v
                        - 2
              - if:
                  cond:
                    equals:
                    - var: c
                    - 1
                  do:
                  - change_variable:
                      var: 单数
                      by: 1
              - if:
                  cond:
                    equals:
                    - var: c
                    - 2
                  do:
                  - change_variable:
                      var: 对数
                      by: 1
              - if:
                  cond:
                    equals:
                    - var: c
                    - 3
                  do:
                  - change_variable:
                      var: 三数
                      by: 1
                  - set_variable:
                      var: 三值
                      value:
                        add:
                        - var: v
                        - 2
                  - if:
                      cond:
                        equals:
                        - var: 三最小
                        - 0
                      do:
                      - set_variable:
                          var: 三最小
                          value:
                            add:
                            - var: v
                            - 2
              - if:
                  cond:
                    equals:
                    - var: c
                    - 4
                  do:
                  - change_variable:
                      var: 四数
                      by: 1
                  - set_variable:
                      var: 四值
                      value:
                        add:
                        - var: v
                        - 2
              - if:
                  cond:
                    and:
                    - greater_than:
                      - var: c
                      - 0
                    - equals:
                      - var: 最小
                      - 0
                  do:
                  - set_variable:
                      var: 最小
                      value:
                        add:
                        - var: v
                        - 2
              - if:
                  cond:
                    greater_than:
                    - var: c
                    - 0
                  do:
                  - set_variable:
                      var: 最大
                      value:
                        add:
                        - var: v
                        - 2
          - set_variable:
              var: 牌型
              value: 不成牌型
          - set_variable:
              var: 主值
              value: 0
          - if:
              cond:
                and:
                - equals:
                  - var: 张数
                  - 2
                - and:
                  - equals:
                    - item_of_list:
                        list: 计
