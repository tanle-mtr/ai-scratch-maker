                          - item_of_list:
                              list: 棋盘
                              index:
                                add:
                                - add:
                                  - multiply:
                                    - subtract:
                                      - var: r1
                                      - 1
                                    - 6
                                  - subtract:
                                    - var: c1
                                    - 1
                                - 1
