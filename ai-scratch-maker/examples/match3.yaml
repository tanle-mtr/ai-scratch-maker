                              index:
                                add:
                                - add:
                                  - multiply:
                                    - subtract:
                                      - var: r1
                                      - 1
                                    - 6
                                  - subtract:
                                    - var: c1
                                    - 1
                                - 1
                          - 0
                  do:
                  - replace_item_of_list:
                      list: 掩码
                      index:
                        add:
                        - add:
                          - multiply:
                            - subtract:
                              - var: r1
                              - 1
                            - 6
                          - subtract:
                            - var: c1
                            - 1
                        - 1
                      item: 1
                  - replace_item_of_list:
                      list: 掩码
                      index:
                        add:
                        - add:
                          - add:
                            - multiply:
                              - subtract:
                                - var: r1
                                - 1
                              - 6
                            - subtract:
                              - var: c1
                              - 1
                          - 1
                        - 6
                      item: 1
                  - replace_item_of_list:
                      list: 掩码
                      index:
