                    - 1
              - set_variable:
                  var: cnt
                  value: 0
              - set_variable:
                  var: r1
                  value: 6
              - repeat:
                  times: 6
                  do:
                  - set_variable:
                      var: r1
                      value:
                        subtract:
                        - var: r1
                        - 1
                  - if:
                      cond:
                        not:
                          operand:
                            equals:
                            - item_of_list:
                                list: 棋盘
