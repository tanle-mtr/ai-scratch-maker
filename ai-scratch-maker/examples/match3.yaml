      - set_variable:
          var: 分数
          value:
            add:
            - var: 分数
            - multiply:
              - var: 本轮消除
              - var: 本轮消除
      - if:
          cond:
            greater_than:
              a:
                var: 本轮消除
              b: 0
          do:
          - set_variable:
              var: c1
              value: 0
          - repeat:
              times: 6
              do:
              - set_variable:
                  var: c1
                  value:
                    add:
