                                  add:
                                  - add:
                                    - multiply:
                                      - var: r1
                                      - 6
                                    - subtract:
                                      - var: c1
                                      - 1
                                  - 1
                            - 0
                      do:
                      - replace_item_of_list:
                          list: 列缓存
                          index:
                            add:
                            - var: cnt
                            - 1
                          item:
                            item_of_list:
                              list: 棋盘
                              index:
                                add:
                                - add:
                                  - multiply:
                                    - var: r1
                                    - 6
                                  - subtract:
                                    - var: c1
                                    - 1
                                - 1
                      - set_variable:
                          var: cnt
                          value:
                            add:
                            - var: cnt
                            - 1
              - set_variable:
                  var: r1
                  value: 6
              - repeat:
                  times: 6
                  do:
                  - set_variable:
                      var: r1
                      value:
                        subtract:
                        - var: r1
                        - 1
                  - if:
                      cond:
                        less_than:
                          a:
                            subtract:
                            - 5
                            - var: r1
                          b:
                            var: cnt
                      do:
                      - replace_item_of_list:
                          list: 棋盘
                          index:
                            add:
                            - add:
                              - multiply:
                                - var: r1
                                - 6
                              - subtract:
                                - var: c1
                                - 1
                            - 1
                          item:
                            item_of_list:
                              list: 列缓存
                              index:
                                add:
                                - subtract:
                                  - 5
                                  - var: r1
                                - 1
                      - replace_item_of_list:
                          list: 棋盘
                          index:
                            add:
                            - add:
                              - multiply:
                                - var: r1
                                - 6
                              - subtract:
                                - var: c1
                                - 1
                            - 1
