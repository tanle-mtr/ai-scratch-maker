    procedures:
    - name: 生成棋盘
      script:
      - set_variable:
          var: k
          value: 0
      - repeat:
          times: 36
          do:
          - set_variable:
              var: k
              value:
                add:
                - var: k
                - 1
          - replace_item_of_list:
              list: 棋盘
              index:
                var: k
              item: 0
      - set_variable:
          var: r1
          value: 0
      - repeat:
          times: 6
          do:
          - set_variable:
              var: r1
              value:
                add:
                - var: r1
                - 1
          - set_variable:
              var: c1
              value: 0
          - repeat:
              times: 6
              do:
              - set_variable:
                  var: c1
                  value:
                    add:
                    - var: c1
                    - 1
              - set_variable:
                  var: k
                  value:
                    add:
                    - add:
                      - multiply:
                        - subtract:
                          - var: r1
                          - 1
                        - 6
                      - subtract:
                        - var: c1
                        - 1
                    - 1
              - set_variable:
                  var: __l1
                  value:
                    item_of_list:
                      list: 棋盘
                      index:
                        subtract:
                        - var: k
                        - 1
              - set_variable:
                  var: __l2
                  value:
                    item_of_list:
                      list: 棋盘
                      index:
                        subtract:
                        - var: k
                        - 2
              - set_variable:
                  var: __u1
                  value:
