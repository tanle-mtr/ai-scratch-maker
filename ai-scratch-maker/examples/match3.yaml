                  - replace_item_of_list:
                      list: 掩码
                      index:
                        add:
                        - add:
                          - add:
                            - multiply:
                              - subtract:
                                - var: r1
                                - 1
                              - 6
                            - subtract:
                              - var: c1
                              - 1
                          - 1
                        - 2
                      item: 1
      - set_variable:
          var: c1
          value: 0
      - repeat:
          times: 6
          do:
          - set_variable:
              var: c1
              value:
                add:
                - var: c1
                - 1
          - set_variable:
              var: r1
              value: 0
          - repeat:
              times: 4
              do:
              - set_variable:
                  var: r1
                  value:
                    add:
                    - var: r1
                    - 1
              - if:
                  cond:
                    and:
                    - and:
                      - equals:
                        - item_of_list:
                            list: 棋盘
                            index:
                              add:
                              - add:
                                - multiply:
                                  - subtract:
                                    - var: r1
                                    - 1
                                  - 6
                                - subtract:
                                  - var: c1
                                  - 1
                              - 1
                        - item_of_list:
                            list: 棋盘
