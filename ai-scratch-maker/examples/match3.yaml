                      list: 棋盘
                      index:
                        subtract:
                        - var: k
                        - 6
              - set_variable:
                  var: __u2
                  value:
                    item_of_list:
                      list: 棋盘
                      index:
                        subtract:
                        - var: k
                        - 12
              - set_variable:
                  var: __cand
                  value:
                    random:
                      from: 1
                      to: 4
              - repeat_until:
                  cond:
                    and:
                    - or:
                      - not:
                          operand:
                            equals:
                            - var: __cand
                            - var: __l1
                      - not:
                          operand:
                            equals:
                            - var: __l1
                            - var: __l2
                    - or:
                      - not:
                          operand:
                            equals:
                            - var: __cand
                            - var: __u1
                      - not:
                          operand:
                            equals:
                            - var: __u1
                            - var: __u2
                  do:
                  - set_variable:
                      var: __cand
                      value:
                        add:
                        - mod:
                          - var: __cand
                          - 4
                        - 1
              - replace_item_of_list:
                  list: 棋盘
                  index:
                    var: k
                  item:
                    var: __cand
