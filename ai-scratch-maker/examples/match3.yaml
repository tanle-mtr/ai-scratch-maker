                            - multiply:
                              - subtract:
                                - var: r1
                                - 1
                              - 6
                            - subtract:
                              - var: c1
                              - 1
                          - 1
                        - 12
                      item: 1
      - set_variable:
          var: k
          value: 0
      - repeat:
          times: 36
          do:
          - set_variable:
              var: k
              value:
                add:
