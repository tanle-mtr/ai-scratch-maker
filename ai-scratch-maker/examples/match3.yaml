                    - var: c1
                    - 1
              - if:
                  cond:
                    and:
                    - and:
                      - equals:
                        - item_of_list:
                            list: 棋盘
                            index:
                              add:
                              - add:
                                - multiply:
                                  - subtract:
                                    - var: r1
                                    - 1
                                  - 6
                                - subtract:
