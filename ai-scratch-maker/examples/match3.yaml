                - 1
          - if:
              cond:
                equals:
                - item_of_list:
                    list: 掩码
                    index:
                      var: k
                - 1
              do:
              - replace_item_of_list:
                  list: 棋盘
                  index:
                    var: k
                  item: 0
              - set_variable:
                  var: 本轮消除
                  value:
                    add:
                    - var: 本轮消除
                    - 1
      - set_variable:
          var: 分数
          value:
            add:
            - var: 分数
            - multiply:
