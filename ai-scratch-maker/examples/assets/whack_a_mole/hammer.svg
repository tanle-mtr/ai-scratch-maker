<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7F7F7F"/>
      <stop offset="1" stop-color="#675D5D"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#675D5D"/>
      <stop offset="1" stop-color="#4F4A47"/>
    </linearGradient>
  </defs>

  <!-- 手柄 -->
  <rect x="42" y="44" width="16" height="64" rx="6" fill="#4F4A47"/>
  <rect x="44" y="46" width="12" height="60" rx="5" fill="url(#grip)"/>
  <!-- 握把底环 -->
  <rect x="38" y="102" width="24" height="10" rx="5" fill="#4F4A47"/>

  <!-- 锤头外描边 -->
  <rect x="14" y="20" width="72" height="34" rx="10" fill="#4F4A47"/>
  <!-- 锤头主体 -->
  <rect x="17" y="23" width="66" height="28" rx="8" fill="url(#head)"/>
  <!-- 顶部高光 -->
  <rect x="21" y="26" width="58" height="8" rx="4" fill="#C4FFE3" opacity="0.35"/>
  <!-- 黄色装饰条 -->
  <rect x="17" y="36" width="66" height="6" fill="#FFCF4D"/>
</svg>
