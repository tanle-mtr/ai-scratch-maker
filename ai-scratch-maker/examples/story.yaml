project:
  name: 分支叙事示例
  stage:
    backdrops:
    - name: 背景1
      asset: assets/story/game_bg.png
    variables:
      当前节点: 1
      显示文本: ''
      打字进度: 0
      当前文本: ''
      对话中: 1
      待推进: 0
      待选择: 0
      结局: 0
      结局1计数: 0
      结局2计数: 0
      得分: 0
      运势: 1
    lists:
      节点文本:
      - 你醒来在神秘森林。
      - 精灵：你要往哪走？
      - 左边有一只宝箱！
      - 右边有一只怪物……
      - 【结局一：获得宝藏】
      - 【结局二：险胜怪物】
      节点类型:
      - 0
      - 1
      - 0
      - 0
      - 2
      - 2
      自动下一:
      - 2
      - 0
      - 5
      - 6
      - 0
      - 0
      选项A文本:
      - ''
      - 向左走
      - ''
      - ''
      - ''
      - ''
      选项B文本:
      - ''
      - 向右走
      - ''
      - ''
      - ''
      - ''
      选项A跳转:
      - 0
      - 3
      - 0
      - 0
      - 0
      - 0
      选项B跳转:
      - 0
      - 4
      - 0
      - 0
      - 0
      - 0
      结局值:
      - 0
      - 0
      - 0
      - 0
      - 1
      - 2
    sounds:
      - {name: 选项音, asset: assets/sfx/ui_click.wav}
      - {name: 结局音, asset: assets/sfx/ev_win.wav}
      - {name: 推进音, asset: assets/sfx/fx_pop.wav}
    monitors:
      - {var: 得分, x: 200, y: 8}
      - {var: 运势, x: 200, y: 30}
    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 当前节点
          value: 1
      - set_variable:
          var: 显示文本
          value: ''
      - set_variable:
          var: 打字进度
          value: 0
      - set_variable:
          var: 当前文本
          value: ''
      - set_variable:
          var: 对话中
          value: 1
      - set_variable:
          var: 待推进
          value: 0
      - set_variable:
          var: 待选择
          value: 0
      - set_variable:
          var: 结局
          value: 0
      - set_variable:
          var: 结局1计数
          value: 0
      - set_variable:
          var: 结局2计数
          value: 0
      - set_variable:
          var: 得分
          value: 0
      - set_variable:
          var: 运势
          value: {random: [1, 6]}
      - broadcast:
          message: 演节点
    - - when_receive:
          message: 演节点
      - set_variable:
          var: 当前文本
          value:
            item_of_list:
              list: 节点文本
              index:
                var: 当前节点
      - set_variable:
          var: 显示文本
          value: ''
      - set_variable:
          var: 打字进度
          value: 0
      - if:
          cond:
            equals:
            - item_of_list:
                list: 节点类型
                index:
                  var: 当前节点
            - 0
          do:
          - set_variable:
              var: 待推进
              value: 1
      - if:
          cond:
            equals:
            - item_of_list:
                list: 节点类型
                index:
                  var: 当前节点
            - 1
          do:
          - set_variable:
              var: 待选择
              value: 1
          - broadcast:
              message: 显示选项
      - if:
          cond:
            equals:
            - item_of_list:
                list: 节点类型
                index:
                  var: 当前节点
            - 2
          do:
          - set_variable:
              var: 结局
              value:
                item_of_list:
                  list: 结局值
                  index:
                    var: 当前节点
          - if:
              cond:
                equals:
                - var: 结局
                - 1
              do:
              - change_variable:
                  var: 结局1计数
                  by: 1
          - if:
              cond:
                equals:
                - var: 结局
                - 2
              do:
              - change_variable:
                  var: 结局2计数
                  by: 1
          - set_variable:
              var: 对话中
              value: 0
          - change_variable:
              var: 得分
              by: 1
          - broadcast:
              message: 结算
          - broadcast:
              message: 通关
          - broadcast:
              message: 播结局音
      - repeat_until:
          cond:
            equals:
            - var: 打字进度
            - length_of:
                string:
                  var: 当前文本
          do:
          - set_variable:
              var: 显示文本
              value:
                join:
                  a:
                    var: 显示文本
                  b:
                    letter_of:
                      letter:
                        add:
                        - var: 打字进度
                        - 1
                      word:
                        var: 当前文本
          - change_variable:
              var: 打字进度
              by: 1
          - wait:
              secs: 0.02
    - - when_receive:
          message: 推进
      - if:
          cond:
            equals:
            - var: 待推进
            - 1
          do:
          - set_variable:
              var: 待推进
              value: 0
          - set_variable:
              var: 当前节点
              value:
                item_of_list:
                  list: 自动下一
                  index:
                    var: 当前节点
          - broadcast:
              message: 演节点
          - broadcast:
              message: 播推进音
    - - when_receive:
          message: 选A
      - if:
          cond:
            equals:
            - var: 待选择
            - 1
          do:
          - set_variable:
              var: 待选择
              value: 0
          - set_variable:
              var: 当前节点
              value:
                item_of_list:
                  list: 选项A跳转
                  index:
                    var: 当前节点
          - broadcast:
              message: 演节点
    - - when_receive:
          message: 选B
      - if:
          cond:
            equals:
            - var: 待选择
            - 1
          do:
          - set_variable:
              var: 待选择
              value: 0
          - set_variable:
              var: 当前节点
              value:
                item_of_list:
                  list: 选项B跳转
                  index:
                    var: 当前节点
          - broadcast:
              message: 演节点
    - - when_receive:
          message: 播选项音
      - play_sound: {sound: 选项音}
    - - when_receive:
          message: 播结局音
      - play_sound: {sound: 结局音}
    - - when_receive:
          message: 播推进音
      - play_sound: {sound: 推进音}
  sprites:
  - name: 玩家
    x: 0
    y: -100
    size: 80
    rotationStyle: left-right
    costumes:
      - {name: 站立, asset: assets/story/hero.png}
      - {name: 行走, asset: assets/story/hero.png}
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
      - goto_xy:
          x: 0
          y: -100
    - - when_receive:
          message: 移动
      - switch_costume:
          costume: 行走
      - if:
          cond:
            equals:
            - var: 对话中
            - 0
          do:
          - change_x:
              dx: 10
      - switch_costume:
          costume: 站立
  - name: 选项A
    x: -100
    y: -120
    costumes:
    - name: btnA
      asset: assets/btnA.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - hide: null
    - - when_receive:
          message: 显示选项
      - show: null
    - - when_this_sprite_clicked: null
      - broadcast:
          message: 选A
      - broadcast:
          message: 播选项音
  - name: 选项B
    x: 100
    y: -120
    costumes:
    - name: btnB
      asset: assets/btnB.svg
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - hide: null
    - - when_receive:
          message: 显示选项
      - show: null
    - - when_this_sprite_clicked: null
      - broadcast:
          message: 选B
      - broadcast:
          message: 播选项音
  - name: 指引
    x: 200
    y: 130
    size: 70
    rotationStyle: don't rotate
    costumes:
      - {name: 罗盘, asset: assets/story/compass.svg}
    variables: {}
    scripts:
    - - when_green_flag_clicked: null
      - show: null
      - goto_xy:
          x: 200
          y: 130
      - forever:
          do:
            - glide_xy: {secs: 1.2, x: 200, y: 120}
            - glide_xy: {secs: 1.2, x: 200, y: 140}
