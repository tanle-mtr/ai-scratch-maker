    scripts:
    - - when_green_flag_clicked: null
      - set_variable:
          var: 自动帧
          value: 1
      - set_variable:
          var: 结果
          value: 音游判定台：BPM / 谱面 / 判定 / 长按 / 结算
      - show: null
      - forever:
          do:
          - if:
              cond:
                equals:
                - var: 自动帧
                - 1
              do:
              - change_variable:
                  var: 帧计数
                  by: 1
              - broadcast:
                  message: 帧
          - wait:
              secs: 0.02
    - - when_receive:
          message: 重置
      - set_variable:
          var: 分数
          value: 0
      - set_variable:
          var: 裸分
          value: 0
      - set_variable:
          var: 连击
          value: 0
      - set_variable:
