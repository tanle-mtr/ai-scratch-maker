          value: 0
      - set_variable:
          var: 档G数
          value: 0
      - set_variable:
          var: 档Good数
          value: 0
      - set_variable:
          var: 档Miss数
          value: 0
      - set_variable:
          var: songTime
          value: 0
      - set_variable:
          var: 扫描指针
          value: 1
      - set_variable:
          var: 判定档
          value: 0
      - set_variable:
          var: 长按索引
          value: 0
      - set_variable:
          var: 加成连击
          value: 0
      - set_variable:
          var: 结果
          value: 已重置
  sprites:
  - name: 裁判
    x: 0
    y: 0
    costumes:
    - name: dot
      asset: assets/dot.svg
    variables: {}
    scripts:
    - - when_receive:
          message: 算BPM
      - set_variable:
          var: 拍长ms
          value:
            round:
            - divide:
              - 60000
              - var: BPM
      - set_variable:
          var: 十六分ms
          value:
            round:
            - divide:
              - var: 拍长ms
              - 4
      - set_variable:
          var: 三连音ms
          value:
            round:
            - divide:
              - var: 拍长ms
              - 3
      - set_variable:
          var: 窗口P
          value:
            var: 帧长ms
      - set_variable:
          var: 窗口G
          value:
            multiply:
            - var: 帧长ms
            - 2
      - set_variable:
          var: 窗口Good
          value:
            multiply:
            - var: 帧长ms
            - 3
      - set_variable:
          var: 窗口Miss
          value:
            multiply:
            - var: 帧长ms
            - 4
      - set_variable:
          var: 结果
          value:
            join:
              a:
                join:
                  a:
                    join:
                      a:
                        join:
                          a:
                            join:
                              a:
                                join:
                                  a:
                                    join:
                                      a:
                                        join:
                                          a:
                                            join:
                                              a:
                                                join:
                                                  a:
                                                    join:
                                                      a:
                                                        join:
                                                          a:
                                                            join:
                                                              a:
                                                                join:
                                                                  a:
                                                                    join:
                                                                      a: 'BPM '
                                                                      b:
                                                                        var: BPM
                                                                  b: ' → 拍 '
                                                              b:
                                                                var: 拍长ms
                                                          b: 'ms / 16分 '
                                                      b:
                                                        var: 十六分ms
                                                  b: 'ms / 三连音 '
                                              b:
                                                var: 三连音ms
                                          b: 'ms / 窗口 '
                                      b:
                                        var: 窗口P
                                  b: '-'
                              b:
                                var: 窗口G
                          b: '-'
                      b:
                        var: 窗口Good
                  b: '-'
              b:
                var: 窗口Miss
    - - when_receive:
          message: 生成谱面
      - delete_all_of_list:
          list: 音符时刻
      - delete_all_of_list:
          list: 音符轨道
      - delete_all_of_list:
          list: 音符类型
      - delete_all_of_list:
          list: 音符时长
      - delete_all_of_list:
          list: 已判定
      - delete_all_of_list:
          list: 误差表
      - delete_all_of_list:
          list: 判定档表
      - set_variable:
          var: 音符数
          value: 0
      - set_variable:
          var: 扫描指针
          value: 1
      - set_variable:
          var: 小节
          value: 0
      - repeat:
          times:
            var: 小节数
          do:
          - change_variable:
              var: 小节
              by: 1
          - set_variable:
              var: 位
              value: 0
          - repeat:
              times: 16
              do:
              - change_variable:
                  var: 位
                  by: 1
              - set_variable:
                  var: 格值
                  value:
                    item_of_list:
                      list: 谱面格
                      index:
                        var: 位
              - if:
                  cond:
                    greater_than:
                    - var: 格值
                    - 0
                  do:
                  - set_variable:
                      var: 临时时刻
                      value:
                        add:
                        - var: 谱面偏移ms
                        - add:
                          - multiply:
                            - subtract:
                              - var: 小节
                              - 1
                            - multiply:
                              - 4
                              - var: 拍长ms
                          - multiply:
                            - subtract:
                              - var: 位
                              - 1
                            - var: 十六分ms
                  - add_to_list:
                      list: 音符时刻
                      item:
                        var: 临时时刻
                  - add_to_list:
                      list: 音符轨道
                      item:
                        var: 格值
                  - add_to_list:
                      list: 音符类型
                      item: 1
                  - add_to_list:
                      list: 音符时长
                      item: 0
                  - add_to_list:
                      list: 已判定
                      item: 0
                  - add_to_list:
                      list: 误差表
                      item: 0
                  - add_to_list:
                      list: 判定档表
                      item: 0
                  - change_variable:
                      var: 音符数
                      by: 1
      - set_variable:
          var: 结果
          value:
            join:
              a:
                join:
                  a:
                    join:
                      a: '谱面生成 '
                      b:
                        var: 音符数
                  b: ' 个音符 / 小节数 '
              b:
                var: 小节数
    - - when_receive:
          message: 判一击
      - set_variable:
          var: 有效时刻
          value:
            subtract:
            - var: 输入时刻
            - var: 校准ms
      - set_variable:
          var: 有效时刻
          value:
            multiply:
            - round:
              - divide:
                - var: 有效时刻
                - var: 帧长ms
            - var: 帧长ms
      - set_variable:
          var: 最近索引
          value: 0
      - set_variable:
          var: 最近误差
          value: 999999
      - set_variable:
          var: i
          value: 0
      - repeat:
          times:
            var: 音符数
          do:
          - change_variable:
              var: i
              by: 1
          - set_variable:
              var: 临时
              value:
                mathop:
                  operator: abs
                  num:
                    subtract:
                    - var: 有效时刻
                    - item_of_list:
                        list: 音符时刻
                        index:
                          var: i
          - if:
              cond:
                and:
                - equals:
                  - item_of_list:
                      list: 音符轨道
                      index:
                        var: i
                  - var: 当前轨道
                - and:
                  - equals:
                    - item_of_list:
                        list: 已判定
                        index:
                          var: i
                    - 0
                  - and:
                    - not:
                        operand:
                          equals:
                          - greater_than:
                            - var: 临时
                            - var: 窗口Miss
                          - true
                    - less_than:
                      - var: 临时
                      - var: 最近误差
              do:
              - set_variable:
                  var: 最近误差
                  value:
                    var: 临时
              - set_variable:
                  var: 最近索引
                  value:
                    var: i
      - if:
          cond:
            equals:
            - var: 最近索引
            - 0
          do:
          - set_variable:
              var: 判定档
              value: 0
          - set_variable:
              var: 判定词
              value: 空击
          - set_variable:
              var: 结果
              value: 空击：不判不计分、不断连击
          else:
          - set_variable:
              var: 误差
              value:
                subtract:
                - var: 有效时刻
                - item_of_list:
                    list: 音符时刻
                    index:
                      var: 最近索引
          - set_variable:
              var: 绝对误差
              value:
                mathop:
                  operator: abs
                  num:
                    var: 误差
          - replace_item_of_list:
              list: 误差表
              index:
                var: 最近索引
              item:
                var: 误差
          - if:
              cond:
                equals:
                - item_of_list:
                    list: 音符类型
                    index:
                      var: 最近索引
                - 2
              do:
              - set_variable:
                  var: 判定档
                  value: 5
              - set_variable:
                  var: 判定词
                  value: 长按头已接
              - replace_item_of_list:
                  list: 已判定
                  index:
                    var: 最近索引
                  item: 5
              - set_variable:
                  var: 结果
                  value: 长按头已接，等抬手判尾
              else:
              - if:
                  cond:
                    not:
                      operand:
                        equals:
                        - greater_than:
                          - var: 绝对误差
                          - var: 窗口P
                        - true
                  do:
                  - set_variable:
                      var: 判定档
                      value: 1
                  else:
                  - if:
                      cond:
                        not:
                          operand:
                            equals:
                            - greater_than:
                              - var: 绝对误差
                              - var: 窗口G
                            - true
                      do:
                      - set_variable:
                          var: 判定档
                          value: 2
                      else:
                      - if:
                          cond:
                            not:
                              operand:
                                equals:
                                - greater_than:
                                  - var: 绝对误差
                                  - var: 窗口Good
                                - true
                          do:
                          - set_variable:
                              var: 判定档
                              value: 3
                          else:
                          - set_variable:
                              var: 判定档
                              value: 4
              - replace_item_of_list:
                  list: 已判定
                  index:
                    var: 最近索引
                  item:
                    var: 判定档
              - replace_item_of_list:
                  list: 判定档表
                  index:
                    var: 最近索引
                  item:
                    var: 判定档
              - set_variable:
                  var: 临时
                  value: 0
              - if:
                  cond:
                    equals:
                    - var: 判定档
                    - 1
                  do:
                  - set_variable:
                      var: 临时
                      value: 300
                  - change_variable:
                      var: 档P数
                      by: 1
                  - change_variable:
                      var: 连击
                      by: 1
                  - set_variable:
                      var: 判定词
                      value: PERFECT
                  else:
                  - if:
                      cond:
                        equals:
                        - var: 判定档
                        - 2
                      do:
                      - set_variable:
                          var: 临时
                          value: 200
                      - change_variable:
                          var: 档G数
                          by: 1
                      - change_variable:
                          var: 连击
                          by: 1
                      - set_variable:
                          var: 判定词
                          value: GREAT
                      else:
                      - if:
                          cond:
                            equals:
                            - var: 判定档
                            - 3
                          do:
                          - set_variable:
                              var: 临时
                              value: 100
                          - change_variable:
                              var: 档Good数
                              by: 1
                          - change_variable:
                              var: 连击
                              by: 1
                          - set_variable:
                              var: 判定词
                              value: GOOD
                          else:
                          - set_variable:
                              var: 临时
                              value: 0
                          - change_variable:
                              var: 档Miss数
                              by: 1
                          - set_variable:
                              var: 连击
                              value: 0
                          - set_variable:
                              var: 判定词
                              value: MISS
              - change_variable:
                  var: 裸分
                  by:
                    var: 临时
              - set_variable:
                  var: 加成连击
                  value:
                    var: 连击
              - if:
                  cond:
                    greater_than:
                    - var: 加成连击
                    - 100
                  do:
                  - set_variable:
                      var: 加成连击
                      value: 100
              - change_variable:
                  var: 分数
                  by:
                    round:
                    - multiply:
                      - var: 临时
                      - add:
                        - 1
                        - multiply:
                          - divide:
                            - var: 加成连击
                            - 100
                          - 0.5
              - if:
                  cond:
                    greater_than:
                    - var: 连击
                    - var: 最大连击
                  do:
                  - set_variable:
                      var: 最大连击
                      value:
                        var: 连击
              - set_variable:
                  var: 结果
                  value:
                    join:
                      a:
                        join:
                          a:
                            join:
                              a:
                                join:
                                  a:
                                    join:
                                      a:
                                        join:
                                          a:
                                            var: 判定词
                                          b: ' 误差 '
                                      b:
                                        var: 误差
                                  b: 'ms / 档 '
                              b:
                                var: 判定档
                          b: ' / COMBO '
                      b:
                        var: 连击
    - - when_receive:
          message: 推进
      - repeat_until:
          cond:
            or:
            - greater_than:
              - var: 扫描指针
              - var: 音符数
            - not:
                operand:
                  equals:
                  - greater_than:
                    - var: songTime
                    - add:
                      - item_of_list:
                          list: 音符时刻
                          index:
                            var: 扫描指针
                      - var: 窗口Miss
                  - true
          do:
          - if:
              cond:
                equals:
                - item_of_list:
                    list: 已判定
                    index:
                      var: 扫描指针
                - 0
              do:
              - replace_item_of_list:
                  list: 已判定
                  index:
                    var: 扫描指针
                  item: 4
              - replace_item_of_list:
                  list: 判定档表
                  index:
                    var: 扫描指针
                  item: 4
              - change_variable:
                  var: 档Miss数
                  by: 1
              - set_variable:
                  var: 连击
                  value: 0
          - change_variable:
              var: 扫描指针
              by: 1
      - set_variable:
          var: 结果
          value:
            join:
              a:
                join:
                  a:
                    join:
                      a:
                        join:
                          a:
                            join:
                              a: '推进到 '
                              b:
                                var: songTime
                          b: 'ms / Miss '
                      b:
                        var: 档Miss数
                  b: ' / 指针 '
              b:
                var: 扫描指针
    - - when_receive:
