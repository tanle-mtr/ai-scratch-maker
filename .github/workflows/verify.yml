name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 构建 · 四层校验 · 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow
          npm --prefix ai-scratch-maker install --no-audit --no-fund

      - name: 安装 scratch-vm（可选：用于 L4 运行时校验）
        # 装不上不阻断——校验脚本在找不到 scratch-vm 时按设计输出 SKIP 并以 0 退出，
        # 所以这一层是「白赚」：装上了多校验一层运行时，装不上只是少一层。
        continue-on-error: true
        run: npm --prefix ai-scratch-maker install scratch-vm scratch-parser --no-audit --no-fund

      - name: 构建旗舰示例工程
        working-directory: ai-scratch-maker
        run: python scripts/build_all.py --no-cache --only cat_mouse,fruit_basket,match3,music_band,platformer,quiz,rps,star_catch,story,whack_a_mole

      - name: 四层结构校验（L1 结构 / L2 官方 schema / L3 解析器 / L4 运行时）
        working-directory: ai-scratch-maker
        run: |
          fail=0
          for spec in examples/*.quality.json; do
            name=$(basename "$spec" .quality.json)
            echo "::group::validate $name"
            python scripts/validate_sb3.py --sb3 "examples/output/$name.sb3" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: 质量门禁（--strict）
        working-directory: ai-scratch-maker
        run: |
          fail=0
          for spec in examples/*.quality.json; do
            name=$(basename "$spec" .quality.json)
            echo "::group::gate $name"
            python scripts/quality_gate.py \
              --sb3 "examples/output/$name.sb3" --spec "$spec" --strict || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: 铁律静态检查
        working-directory: ai-scratch-maker
        run: node scripts/check_hard_rules.mjs examples/output
